apiVersion: apps/v1
kind: Deployment
metadata:
  name: redteam-frontend
  namespace: redteam-framework
  labels:
    app: redteam-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redteam-frontend
  template:
    metadata:
      labels:
        app: redteam-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/your-org/redteam-framework-frontend:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: redteam-frontend-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redteam-frontend
  namespace: redteam-framework
spec:
  selector:
    app: redteam-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP