apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redteam-ingress
  namespace: redteam-framework
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - redteam.example.com
    - api.redteam.example.com
    secretName: redteam-tls
  rules:
  - host: redteam.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redteam-frontend
            port:
              number: 3000
  - host: api.redteam.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redteam-api
            port:
              number: 8000