name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redteam
  REDIS_URL: redis://localhost:6379/0
  EVAL_MODE: local
  DEV_MOCK_TARGET_AGENT: true
  DEV_MOCK_JUDGE: true
  DEV_SEED_DATA: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      
      - name: Run Ruff
        run: |
          cd backend
          ruff check .
      
      - name: Run MyPy
        run: |
          cd backend
          mypy app
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
      
      - name: Run TypeScript check
        run: |
          cd frontend
          npm run typecheck

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redteam
        ports: 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5
      chromadb:
        image: chromadb/chroma:0.4.22
        ports: 8000:8000
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: 9000:9000
        options: --health-cmd="curl -f http://localhost:9000/minio/health/live" --health-interval=30s --health-timeout=20s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      
      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head
      
      - name: Seed test data
        run: |
          cd backend
          python ../scripts/seed_demo_data.py
      
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/unit -v --tb=short
      
      - name: Run integration tests
        run: |
          cd backend
          pytest tests/integration -v --tb=short
      
      - name: Run API tests
        run: |
          cd backend
          pytest tests/api -v --tb=short
      
      - name: Run evaluation tests
        run: |
          cd backend
          pytest tests/evaluation -v --tb=short
      
      - name: Run security tests
        run: |
          cd backend
          pytest tests/security -v --tb=short
      
      - name: Run regression tests
        run: |
          cd backend
          pytest tests/regression -v --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --coverage

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Bandit
        run: |
          cd backend
          pip install bandit
          bandit -r app -f json -o bandit-report.json || true
      
      - name: Run pip-audit
        run: |
          cd backend
          pip install pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
      
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json
            frontend/npm-audit-report.json

  build-containers:
    name: Build Containers
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          load: true
          tags: redteam-backend:test
      
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: redteam-frontend:test
      
      - name: Build worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          load: true
          tags: redteam-worker:test

  seeded-regression:
    name: Seeded Regression Benchmark
    runs-on: ubuntu-latest
    needs: build-containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redteam
        ports: 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5
      chromadb:
        image: chromadb/chroma:0.4.22
        ports: 8000:8000
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: 9000:9000
        options: --health-cmd="curl -f http://localhost:9000/minio/health/live" --health-interval=30s --health-timeout=20s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      
      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head
      
      - name: Seed test data
        run: |
          cd backend
          python ../scripts/seed_demo_data.py
      
      - name: Run seeded regression benchmark
        run: |
          cd backend
          python ../scripts/run_seeded_regression.py
        env:
          EVAL_MODE: local
          DEV_MOCK_TARGET_AGENT: true
          DEV_MOCK_JUDGE: true

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-containers
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: docker-compose -f docker-compose.dev.yml up -d
      
      - name: Wait for services
        run: sleep 30
      
      - name: Test backend health
        run: curl -f http://localhost:8000/health
      
      - name: Test frontend
        run: curl -f http://localhost:3000
      
      - name: Run API smoke tests
        run: |
          cd backend
          pip install -e ".[dev]"
          pytest tests/api/test_health.py -v
      
      - name: Cleanup
        run: docker-compose -f docker-compose.dev.yml down -v