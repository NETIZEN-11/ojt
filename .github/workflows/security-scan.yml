name: Security Scan - LLM & Promptfoo Features

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  llm-code-scan:
    name: LLM Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run LLM vulnerability scan
        run: |
          cd backend
          python -c "from app.code_scanning import run_security_scan; r=run_security_scan('.'); print(r.summary); exit(1 if r.summary['critical']>0 else 0)"
      - name: Run Bandit + pip-audit
        run: |
          cd backend
          pip install bandit pip-audit
          bandit -r app -f json -o bandit-report.json || true
          pip-audit --format=json --output=pip-audit-report.json || true
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🔒 LLM Security Scan\n';
            try {
              const data = JSON.parse(fs.readFileSync('backend/bandit-report.json', 'utf8'));
              body += `- Bandit issues: ${data.results?.length || 0}\n`;
            } catch {}
            body += '- Guardrails: jailbreak, prompt injection, PII checked\n';
            github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

  guardrails-check:
    name: Guardrails Policy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check guardrails config
        run: |
          cd backend
          python -c "from app.guardrails.engine import guardrail_engine; print('Guardrails:', list(guardrail_engine._patterns.keys()))"

  model-security:
    name: Model Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run model security dashboard check
        run: |
          cd backend
          python -c "from app.monitoring import security_metrics; print(security_metrics.get_security_dashboard())"

  mcp-proxy-check:
    name: MCP Proxy Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MCP proxy
        run: |
          cd backend
          python -c "from app.mcp import guardrail_check; import asyncio; print(asyncio.run(guardrail_check([type('M',(),{'content':'test'})()])))"