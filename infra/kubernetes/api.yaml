apiVersion: apps/v1
kind: Deployment
metadata:
  name: redteam-api
  namespace: redteam-framework
  labels:
    app: redteam-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redteam-api
  template:
    metadata:
      labels:
        app: redteam-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/redteam-framework-backend:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: redteam-config
        - secretRef:
            name: redteam-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      serviceAccountName: redteam-api
---
apiVersion: v1
kind: Service
metadata:
  name: redteam-api
  namespace: redteam-framework
spec:
  selector:
    app: redteam-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP